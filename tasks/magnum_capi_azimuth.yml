- name: Add k8s management cluster CA to the system trust store
  ansible.builtin.copy:
    content: >-
      {{ (k8s_admin_conf_slurp.content | b64decode | from_yaml).clusters[0].cluster['certificate-authority-data'] | b64decode }}
    dest: "{{ magnum_trust_store_location[ansible_facts['pkg_mgr']] }}kubeadm-capi-mgmt-ca.crt"
    owner: root
    group: root
    mode: '0644'
  register: _magnum_capi_ca_cert

- name: Refresh the system trust store
  ansible.builtin.command: "{{ magnum_trust_store_update_command[ansible_facts['pkg_mgr']] }}"
  when: _magnum_capi_ca_cert is changed
  changed_when: true
  notify: Restart magnum services

- name: Pull and deploy helm charts
  ansible.builtin.include_role:
    name: adriacloud.kubernetes.helm_deploy
  vars:
    helm_deploy_host_group: "{{ magnum_capi_control_cluster_group }}"
    helm_deploy_host: "{{ groups[helm_deploy_host_group] | first }}"
    helm_deploy_python_interpreter: "{{ hostvars[helm_deploy_host]['ansible_collection_kubernetes_target_venv'] }}/bin/python3"
    helm_deploy_charts: "{{ magnum_capi_azimuth_helm_charts }}"
